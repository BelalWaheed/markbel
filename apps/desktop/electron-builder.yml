appId: com.obel.markbel
productName: Markbel
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - build/icon.png
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Markbel
protocols:
  - name: markbel
    schemes:
      - markbel

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Markbel — Ultimate Bookmarks Vault & Link Manager</title>
    <meta name="title" content="Markbel — Ultimate Bookmarks Vault & Link Manager" />
    <meta name="description" content="Markbel is a premium, secure bookmarks vault and link manager that lets you organize, search, and preview your links in real-time. Secure, fast, and beautifully designed." />
    <meta name="keywords" content="bookmarks, link manager, bookmark vault, bookmarking app, link saver, link organizer, secure bookmarks, cyber vault" />
    <meta name="author" content="Markbel" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f0efea" />

    <!-- Canonical Link -->
    <link rel="canonical" href="https://markbel.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://markbel.vercel.app" />
    <meta property="og:title" content="Markbel — Ultimate Bookmarks Vault & Link Manager" />
    <meta property="og:description" content="Markbel is a premium, secure bookmarks vault and link manager that lets you organize, search, and preview your links in real-time." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://markbel.vercel.app" />
    <meta property="twitter:title" content="Markbel — Ultimate Bookmarks Vault & Link Manager" />
    <meta property="twitter:description" content="Markbel is a premium, secure bookmarks vault and link manager that lets you organize, search, and preview your links in real-time." />
    <meta property="twitter:image" content="/logo.png" />

    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Markbel",
        "url": "https://markbel.vercel.app",
        "description": "Markbel is a premium, secure bookmarks vault and link manager that lets you organize, search, and preview your links in real-time.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "All"
      }
    </script>
  </head>
  <body class="bg-[#f0efea] text-[#3b3b3b] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
